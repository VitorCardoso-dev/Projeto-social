<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href__="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
      <main>
         <div class="container">
            <h1>Seja Bem-Vindo ao 
            <span style="color: #f9dc5c;">Educa JB</span></h1>
             <p style="margin-bottom: 10px;">
            Sua plataforma educacional completa,Otimize o controle disciplinar e a gestão de alunos,Registre ocorrências, monitore atrasos e ocorrencias
            </p>
            <div class="icones">
            <div class="ico">
                <i class="fa-solid fa-clock"></i> atrasos   <!-- livro -->
            </div>  
            <br>
            <div class="ico"><i style="font-size: 18px;" class="fa-solid fa-user-friends"></i><p style="margin-left: -3px;">Gerenciamento de alunos</p>
            </div> <!-- pessoas -->
                <br>
            <div class="ico"><i class="fa-solid fa-bell"></i> notificações
            </div>  <!-- certificado -->
           </div> 

           <div class="login">
               <p>ja tem sua conta? <a href="/ESTUDOS/HTML-CSS/form-media.html">fazer login</a></p>
           </div>
        </div>
   
 
   <form action="#">
            <h3>criar conta</h3>
            <p>preencha seus dados</p>
            <label for="nome"><i class="fa-solid fa-user"></i></label>
            <input type="text" id="nome" name="nome" required placeholder="Seu nome">
            <br>
            <label for="email"><i class="fa-solid fa-envelope"></i></label>
            <input type="email" id="email" name="email" required placeholder="Seu email">
            <br>
            
            <label for="funcao"><i class="fa-solid fa-briefcase"></i></label>
            <select id="funcao" name="funcao" required >
            <option  value="" disabled selected hidde>Quem está entrando?</option>
            <option  value="coordenacao">Coordenação</option>
            <option  value="secretaria">Secretaria</option>
            </select>
            
            <br>
            <label for="senha"><i class="fa-solid fa-lock"></i></label>
            <input type="password" id="senha" name="senha" required placeholder="Sua senha">
            <br>
            <div class="botões">
                <input id="cadastrar" type="submit" value="Cadastrar">
                <input id="limpar" type="reset" value="Limpar">
            </div>
     
   </form>
   </main>
 
</body>
</html>
